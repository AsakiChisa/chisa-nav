<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f6fa">
  <meta name="description" content="浅咲的浏览器快速导航主页">
  <title>浅咲导航</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div class="background-layer" aria-hidden="true"></div>
  <main class="page-shell">
    <header class="hero">
      <div>
        <p class="eyebrow" id="dateText">正在读取日期</p>
        <h1 id="greetingText">你好，浅咲</h1>
        <p class="subtitle" id="siteSubtitle">收藏常用网站，快速抵达</p>
      </div>
      <div class="clock-wrap" aria-label="当前时间">
        <div class="clock" id="clockText">--:--</div>
        <button class="icon-button" id="themeButton" type="button" aria-label="切换主题" title="切换主题">◐</button>
      </div>
    </header>

    <section class="search-panel" aria-label="网页搜索">
      <form id="searchForm" autocomplete="off">
        <select id="searchEngine" aria-label="搜索引擎">
          <option value="google">Google</option>
          <option value="bing">Bing</option>
          <option value="baidu">百度</option>
          <option value="github">GitHub</option>
        </select>
        <div class="search-input-wrap" id="searchInputWrap">
          <input
            id="searchInput"
            type="search"
            placeholder="搜索网页，按 / 快速聚焦"
            aria-label="搜索内容"
            role="combobox"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-controls="suggestionList"
          >
          <ul id="suggestionList" class="suggestion-list" role="listbox" hidden></ul>
          <span id="suggestionStatus" class="sr-only" aria-live="polite"></span>
        </div>
        <button type="submit">搜索</button>
      </form>
    </section>

    <nav id="categoryBar" class="category-bar" aria-label="导航分类" hidden>
      <div id="categoryTabs" class="category-tabs" role="tablist" aria-label="网站分类"></div>
    </nav>

    <section id="navigationRoot" class="navigation-root" aria-live="polite">
      <div class="loading-card">正在加载导航内容…</div>
    </section>

    <footer>
      <span id="siteTitleFooter">浅咲导航</span>
      <a href="/admin/" rel="nofollow">管理后台</a>
    </footer>
  </main>

  <template id="linkCardTemplate">
    <a class="link-card">
      <span class="link-icon-wrap">
        <img class="link-icon" alt="" loading="lazy">
        <span class="link-icon-fallback"></span>
      </span>
      <span class="link-copy">
        <strong class="link-title"></strong>
        <small class="link-description"></small>
        <small class="link-group-tag"></small>
      </span>
      <span class="link-arrow" aria-hidden="true">↗</span>
    </a>
  </template>

  <script src="/js/main.js" defer></script>
</body>
</html>
